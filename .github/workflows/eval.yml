name: eval-gate
on: [pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install .
      - run: python scripts/generate_data.py
      - run: make eval
      - run: python -m evals.runners.results_table --check   # fails on recall/ASR regression
