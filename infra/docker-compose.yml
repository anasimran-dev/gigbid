x-py: &py
  build: {context: .., dockerfile: infra/docker/Dockerfile.py}
  env_file: ../.env
  depends_on: [postgres, redis]
services:
  web:      {build: {context: .., dockerfile: infra/docker/Dockerfile.web}, ports: ["5173:80"]}
  api:      {<<: *py, command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000, ports: ["8000:8000"]}
  worker:   {<<: *py, command: python -m worker.main}
  mcp-portfolio:   {<<: *py, command: python -m mcp_servers.portfolio.server, ports: ["8101:8101"]}
  mcp-marketplace: {<<: *py, command: python -m mcp_servers.marketplace.server, ports: ["8102:8102"]}
  mcp-workspace:   {<<: *py, command: python -m mcp_servers.workspace.server, ports: ["8103:8103"]}
  gigsim:   {<<: *py, command: uvicorn gigsim.app:app --host 0.0.0.0 --port 8200, ports: ["8200:8200"]}
  postgres: {image: "postgres:16", environment: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid}, volumes: ["pg:/var/lib/postgresql/data"]}
  redis:    {image: "redis:7"}
  ollama:   {image: "ollama/ollama", profiles: [local], volumes: ["ollama:/root/.ollama"]}
volumes: {pg: {}, ollama: {}}
