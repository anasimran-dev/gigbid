[project]
name = "gigbid"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "langgraph==0.6.*", "langgraph-checkpoint-postgres==2.*", "langchain-mcp-adapters==0.1.*",
 "mcp>=2,<3", "fastapi==0.115.*", "uvicorn==0.32.*", "httpx==0.27.*", "pydantic==2.*",
 "psycopg[binary,pool]==3.2.*", "arq==0.26.*", "PyJWT==2.*", "cryptography==43.*",
 "networkx==3.*", "scikit-learn==1.5.*", "numpy", "pyyaml", "pypdf", "openai==1.*",
]
[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "gigsim*", "mcp_servers*", "worker*", "scripts*", "evals*", "apps*"]
